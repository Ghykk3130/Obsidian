<!doctype html>
<html><head><meta charset="utf-8"><title>wick demo</title>
<style>
 body{background:#fff;color:#111;font-family:Georgia,serif;padding:10px;}
 .row{margin:4px 0;padding:3px 10px;border-left:3px solid #e3e3e3;}
 .label{font-family:Consolas,monospace;font-size:11px;color:#666;}
 .box{font-size:30px;min-height:52px;margin-top:2px;}
</style>
<script>
window.MathJax={tex:{packages:{'[+]':["enclose","ams","boldsymbol","color","html","mathtools","physics","braket","cancel"]},inlineMath:[],displayMath:[],processEscapes:false,processEnvironments:false,processRefs:false},startup:{typeset:false},options:{enableMenu:false}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js"></script>
</head><body>
<div class="row"><div class="label">Peskin (4.36): propagator as a contraction</div><div class="box" data-tex="\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phi(x)\phi(y)\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}} = D_F(x-y)"></div></div>
<div class="row"><div class="label">Peskin (4.37) shape, inside a T-product</div><div class="box" data-tex="\langle 0 | T\{ \rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phi(x)\phi(y)\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}} \} | 0 \rangle"></div></div>
<div class="row"><div class="label">fermion line</div><div class="box" data-tex="\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\bar\psi(x)\,\gamma^\mu\,\psi(y)\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}}"></div></div>
<div class="row"><div class="label">stacked (nested) — outer rail lifts automatically</div><div class="box" data-tex="\rlap{\rule[1.08em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.43em}}\hspace{0.09em}\bar\psi(x)\,\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\gamma^\mu\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}}\,\psi(y)\hspace{0.09em}}\llap{\rule[1.08em]{0.05em}{0.42em}}"></div></div>
<div class="row"><div class="label">several disjoint contractions</div><div class="box" data-tex="\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phi_1\phi_2\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}}\,\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phi_3\phi_4\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}}"></div></div>
<div class="row"><div class="label">4-arg form: prefix outside the mark</div><div class="box" data-tex="i\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}A_\mu\,B^\mu\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}} = i\,A_\mu B^\mu"></div></div>
<div class="row"><div class="label">mark below</div><div class="box" data-tex="\rlap{\rule[-1.17em]{0.05em}{0.42em}}\underline{\vphantom{\rule[-1.05em]{0pt}{0.01em}}\hspace{0.09em}\phi(x)\phi(y)\hspace{0.09em}}\llap{\rule[-1.17em]{0.05em}{0.42em}}"></div></div>
<div class="row"><div class="label">inline in a sentence</div><div class="box" data-tex="\text{so } \rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phi(x)\phi(y)\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}} \text{ is the propagator}"></div></div>
<div class="row"><div class="label">explicit taller rail</div><div class="box" data-tex="\rlap{\rule[1.15em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.50em}}\hspace{0.09em}\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\bar\psi(x)\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}}\,\psi(y)\hspace{0.09em}}\llap{\rule[1.15em]{0.05em}{0.42em}}"></div></div>
<script>
MathJax.startup.promise.then(()=>{
  document.head.appendChild(MathJax.svgStylesheet());
  for (const el of document.querySelectorAll('.box')) {
    try { const n=MathJax.tex2svg(el.dataset.tex,{display:true}); el.textContent=''; el.appendChild(n); }
    catch(e){ el.textContent='ERROR: '+e.message; }
  }
  document.title='DONE';
});
</script></body></html>

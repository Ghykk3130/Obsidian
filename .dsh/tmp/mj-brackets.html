<!doctype html>
<html><head><meta charset="utf-8"><title>brackets</title>
<style>
 body{background:#fff;color:#111;font-family:Georgia,serif;padding:10px;}
 .row{margin:4px 0;padding:2px 10px;border-left:3px solid #e3e3e3;}
 .label{font-family:Consolas,monospace;font-size:12px;color:#666;}
 .box{font-size:40px;min-height:56px;}
</style>
<script>
window.MathJax={tex:{packages:{'[+]':["enclose","ams","boldsymbol","color","html","mathtools","physics","braket","cancel"]},inlineMath:[],displayMath:[],processEscapes:false,processEnvironments:false,processRefs:false},startup:{typeset:false},options:{enableMenu:false}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js"></script>
</head><body>

<div class="row"><div class="label">1 overbracket short</div>
<div class="box" data-tex="\overbracket{\phi(x)\phi(y)}"></div></div>

<div class="row"><div class="label">2 overbracket long (fermion)</div>
<div class="box" data-tex="\overbracket{\bar\psi(x)\,\gamma^\mu\,\psi(y)}"></div></div>

<div class="row"><div class="label">3 overbracket nested</div>
<div class="box" data-tex="\overbracket{\bar\psi(x)\,\overbracket{\gamma^\mu}\,\psi(y)}"></div></div>

<div class="row"><div class="label">4 underbracket</div>
<div class="box" data-tex="\underbracket{\phi(x)\phi(y)}"></div></div>

<div class="row"><div class="label">5 overbracket raised by strut</div>
<div class="box" data-tex="\overbracket{\vphantom{\rule{0pt}{0.7em}}\phi(x)\phi(y)}"></div></div>

<div class="row"><div class="label">6 overbrace for comparison</div>
<div class="box" data-tex="\overbrace{\phi(x)\phi(y)}"></div></div>

<div class="row"><div class="label">7 enclose top (old)</div>
<div class="box" data-tex="\enclose{top}[padding=0.25em]{\phi(x)\phi(y)}"></div></div>

<div class="row"><div class="label">8 control</div>
<div class="box" data-tex="\phi(x)\phi(y)"></div></div>

<script>
MathJax.startup.promise.then(()=>{
  document.head.appendChild(MathJax.svgStylesheet());
  for (const el of document.querySelectorAll('.box')) {
    try { const n=MathJax.tex2svg(el.dataset.tex,{display:true}); el.textContent=''; el.appendChild(n); }
    catch(e){ el.textContent='ERROR: '+e.message; }
  }
  document.title='DONE';
});
</script></body></html>

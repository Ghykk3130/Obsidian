<!doctype html>
<html><head><meta charset="utf-8"><title>hooks2</title>
<style>
 body{background:#fff;color:#111;font-family:Georgia,serif;padding:8px;}
 .row{margin:2px 0;padding:2px 8px;border-left:3px solid #e3e3e3;}
 .label{font-family:Consolas,monospace;font-size:11px;color:#666;}
 .box{font-size:52px;min-height:86px;}
</style>
<script>
window.MathJax={tex:{packages:{'[+]':["enclose","ams","boldsymbol","color","html","mathtools","physics","braket","cancel"]},inlineMath:[],displayMath:[],processEscapes:false,processEnvironments:false,processRefs:false},startup:{typeset:false},options:{enableMenu:false}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js"></script>
</head><body>

<div class="row"><div class="label">A strut 1.0em, hook 0.50..1.02</div>
<div class="box" data-tex="\rlap{\rule[0.50em]{0.55pt}{0.52em}}\overline{\vphantom{\rule{0pt}{1.0em}}\hspace{0.10em}\phi(x)\phi(y)\hspace{0.10em}}\llap{\rule[0.50em]{0.55pt}{0.52em}}"></div></div>

<div class="row"><div class="label">B strut 1.0em, hook 0.42..1.02</div>
<div class="box" data-tex="\rlap{\rule[0.42em]{0.55pt}{0.60em}}\overline{\vphantom{\rule{0pt}{1.0em}}\hspace{0.10em}\phi(x)\phi(y)\hspace{0.10em}}\llap{\rule[0.42em]{0.55pt}{0.60em}}"></div></div>

<div class="row"><div class="label">C fermion, strut 1.0em, hook 0.42..1.02</div>
<div class="box" data-tex="\rlap{\rule[0.42em]{0.55pt}{0.60em}}\overline{\vphantom{\rule{0pt}{1.0em}}\hspace{0.10em}\bar\psi(x)\,\gamma^\mu\,\psi(y)\hspace{0.10em}}\llap{\rule[0.42em]{0.55pt}{0.60em}}"></div></div>

<div class="row"><div class="label">D tall content (supers) - does rail detach?</div>
<div class="box" data-tex="\rlap{\rule[0.42em]{0.55pt}{0.60em}}\overline{\vphantom{\rule{0pt}{1.0em}}\hspace{0.10em}\phi^{[1]}(x)\phi^{[2]}(y)\hspace{0.10em}}\llap{\rule[0.42em]{0.55pt}{0.60em}}"></div></div>

<div class="row"><div class="label">E nested two levels</div>
<div class="box" data-tex="\rlap{\rule[0.42em]{0.55pt}{0.60em}}\overline{\vphantom{\rule{0pt}{1.0em}}\hspace{0.10em}\bar\psi(x)\,\rlap{\rule[0.42em]{0.55pt}{0.60em}}\overline{\vphantom{\rule{0pt}{1.0em}}\hspace{0.08em}\gamma^\mu\hspace{0.08em}}\llap{\rule[0.42em]{0.55pt}{0.60em}}\,\psi(y)\hspace{0.10em}}\llap{\rule[0.42em]{0.55pt}{0.60em}}"></div></div>

<div class="row"><div class="label">F native overbracket (reference)</div>
<div class="box" data-tex="\overbracket{\phi(x)\phi(y)}"></div></div>

<script>
MathJax.startup.promise.then(()=>{
  document.head.appendChild(MathJax.svgStylesheet());
  for (const el of document.querySelectorAll('.box')) {
    try { const n=MathJax.tex2svg(el.dataset.tex,{display:true}); el.textContent=''; el.appendChild(n); }
    catch(e){ el.textContent='ERROR: '+e.message; }
  }
  document.title='DONE';
});
</script></body></html>

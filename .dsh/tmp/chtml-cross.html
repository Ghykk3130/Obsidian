<!doctype html>
<html><head><meta charset="utf-8"><title>chtml-cross</title>
<style>
 body{background:#fff;color:#111;margin:0;padding:10px;font-family:Georgia,serif;}
 .lab{font:11px Consolas,monospace;color:#666;margin-top:10px;}
 .box{font-size:34px;min-height:52px;}
</style>
<script>
window.MathJax={tex:{packages:{'[+]':["ams","mathtools","color","enclose","boldsymbol","html","bbox","cancel","physics","braket","mhchem"]},inlineMath:[],displayMath:[],processEscapes:false,processEnvironments:false,processRefs:false},output:{fontPath:'https://cdn.jsdelivr.net/npm/mathjax@3/es5/output/chtml/fonts/woff-v2'},startup:{typeset:false},options:{enableMenu:false}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
</head><body>
<div class="lab">crossing: (1,3) low + (2,4) high</div><div class="box" data-tex="\rlap{\phantom{\phi_1}\rlap{\rlap{\rule[1.05em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.40em}}\hspace{0.09em}\phantom{\phi_2\phi_3\phi_4}\hspace{0.09em}}\llap{\rule[1.05em]{0.05em}{0.42em}}}}\rlap{\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phantom{\phi_1\phi_2\phi_3}\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}}}\phi_1\phi_2\phi_3\phi_4"></div>
<div class="lab">crossing with wider middle: (1,3)+(2,5)</div><div class="box" data-tex="\rlap{\phantom{\phi_1}\rlap{\rlap{\rule[1.05em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.40em}}\hspace{0.09em}\phantom{\phi_2\phi_3\phi_4\phi_5}\hspace{0.09em}}\llap{\rule[1.05em]{0.05em}{0.42em}}}}\rlap{\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phantom{\phi_1\phi_2\phi_3}\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}}}\phi_1\phi_2\phi_3\phi_4\phi_5"></div>
<div class="lab">below crossing</div><div class="box" data-tex="\rlap{\phantom{\phi_1}\rlap{\rlap{\rule[-1.52em]{0.05em}{0.42em}}\underline{\vphantom{\rule[-1.40em]{0pt}{0.01em}}\hspace{0.09em}\phantom{\phi_2\phi_3\phi_4}\hspace{0.09em}}\llap{\rule[-1.52em]{0.05em}{0.42em}}}}\rlap{\rlap{\rule[-1.17em]{0.05em}{0.42em}}\underline{\vphantom{\rule[-1.05em]{0pt}{0.01em}}\hspace{0.09em}\phantom{\phi_1\phi_2\phi_3}\hspace{0.09em}}\llap{\rule[-1.17em]{0.05em}{0.42em}}}\phi_1\phi_2\phi_3\phi_4"></div>
<div class="lab">nested for comparison: (1,4)+(2,3)</div><div class="box" data-tex="\rlap{\rule[1.08em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.43em}}\hspace{0.09em}\phi_1\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phi_2\phi_3\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}}\phi_4\hspace{0.09em}}\llap{\rule[1.08em]{0.05em}{0.42em}}"></div>
<div class="lab">plain wick (regression)</div><div class="box" data-tex="\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phi(x)\phi(y)\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}} = D_F(x-y)"></div>
<script>
MathJax.startup.promise.then(async () => {
  document.head.appendChild(MathJax.chtmlStylesheet());
  for (const el of document.querySelectorAll('.box')) {
    try { el.appendChild(MathJax.tex2chtml(el.dataset.tex, {display: true})); }
    catch (e) { el.textContent = 'ERROR: ' + e.message; }
  }
  // same refresh Obsidian's finishRenderMath() performs
  for (const s of document.querySelectorAll('style[id^="MJX-"]')) {
    s.dataset.change = s.dataset.change === '1' ? '2' : '1';
  }
  void document.body.offsetHeight;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  await new Promise(r => setTimeout(r, 300));
  const w = [...document.querySelectorAll('.box mjx-container')].map(c => Math.round(c.getBoundingClientRect().width));
  document.title = 'DONE ' + JSON.stringify(w);
});
</script></body></html>

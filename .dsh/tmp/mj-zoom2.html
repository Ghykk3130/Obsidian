<!doctype html>
<html><head><meta charset="utf-8"><title>zoom2</title>
<style>body{background:#fff;margin:0;padding:4px;color:#111}.box{font-size:190px;line-height:1.15}</style>
<script>
window.MathJax={tex:{packages:{'[+]':["ams","mathtools","color"]},inlineMath:[],displayMath:[],processEscapes:false,processEnvironments:false,processRefs:false},startup:{typeset:false},options:{enableMenu:false}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js"></script>
</head><body>
<div class="box" id="a" data-tex="\rlap{\rule[0.70em]{0.05em}{0.42em}}\overline{\vphantom{\rule{0pt}{1.05em}}\hspace{0.09em}\phi(x)\phi(y)\hspace{0.09em}}\llap{\rule[0.70em]{0.05em}{0.42em}}"></div>
<script>
MathJax.startup.promise.then(()=>{
  document.head.appendChild(MathJax.svgStylesheet());
  const el=document.getElementById('a');
  el.appendChild(MathJax.tex2svg(el.dataset.tex,{display:true}));
  document.title='DONE';
});
</script></body></html>

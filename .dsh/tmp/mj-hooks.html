<!doctype html>
<html><head><meta charset="utf-8"><title>hooks</title>
<style>
 body{background:#fff;color:#111;font-family:Georgia,serif;padding:10px;}
 .row{margin:4px 0;padding:2px 10px;border-left:3px solid #e3e3e3;}
 .label{font-family:Consolas,monospace;font-size:12px;color:#666;}
 .box{font-size:38px;min-height:64px;}
</style>
<script>
window.MathJax={tex:{packages:{'[+]':["enclose","ams","boldsymbol","color","html","mathtools","physics","braket","cancel"]},inlineMath:[],displayMath:[],processEscapes:false,processEnvironments:false,processRefs:false},startup:{typeset:false},options:{enableMenu:false}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js"></script>
</head><body>

<div class="row"><div class="label">1 overbracket (native, short hooks)</div>
<div class="box" data-tex="\overbracket{\phi(x)\phi(y)}"></div></div>

<div class="row"><div class="label">2 rlap/llap + overline, hooks 0.5em</div>
<div class="box" data-tex="\rlap{\rule[0.6em]{0.5pt}{0.5em}}\overline{\vphantom{\rule{0pt}{1.1em}}\phi(x)\phi(y)}\llap{\rule[0.6em]{0.5pt}{0.5em}}"></div></div>

<div class="row"><div class="label">3 same, hooks 0.6em to overlap rail</div>
<div class="box" data-tex="\rlap{\rule[0.55em]{0.5pt}{0.62em}}\overline{\vphantom{\rule{0pt}{1.1em}}\phi(x)\phi(y)}\llap{\rule[0.55em]{0.5pt}{0.62em}}"></div></div>

<div class="row"><div class="label">4 with horizontal overhang</div>
<div class="box" data-tex="\rlap{\rule[0.55em]{0.5pt}{0.62em}}\overline{\vphantom{\rule{0pt}{1.1em}}\hspace{0.12em}\phi(x)\phi(y)\hspace{0.12em}}\llap{\rule[0.55em]{0.5pt}{0.62em}}"></div></div>

<div class="row"><div class="label">5 fermion content</div>
<div class="box" data-tex="\rlap{\rule[0.55em]{0.5pt}{0.62em}}\overline{\vphantom{\rule{0pt}{1.1em}}\hspace{0.12em}\bar\psi(x)\,\gamma^\mu\,\psi(y)\hspace{0.12em}}\llap{\rule[0.55em]{0.5pt}{0.62em}}"></div></div>

<div class="row"><div class="label">6 enclose top,left,right over smashed content</div>
<div class="box" data-tex="\enclose{top,left,right}[padding=0.12em]{\vphantom{\rule{0pt}{0.9em}}\smash{\phi(x)\phi(y)}}"></div></div>

<div class="row"><div class="label">7 nested hooks</div>
<div class="box" data-tex="\rlap{\rule[0.55em]{0.5pt}{0.62em}}\overline{\vphantom{\rule{0pt}{1.1em}}\hspace{0.12em}\bar\psi(x)\,\rlap{\rule[0.55em]{0.5pt}{0.62em}}\overline{\vphantom{\rule{0pt}{1.1em}}\hspace{0.1em}\gamma^\mu\hspace{0.1em}}\llap{\rule[0.55em]{0.5pt}{0.62em}}\,\psi(y)\hspace{0.12em}}\llap{\rule[0.55em]{0.5pt}{0.62em}}"></div></div>

<script>
MathJax.startup.promise.then(()=>{
  document.head.appendChild(MathJax.svgStylesheet());
  for (const el of document.querySelectorAll('.box')) {
    try { const n=MathJax.tex2svg(el.dataset.tex,{display:true}); el.textContent=''; el.appendChild(n); }
    catch(e){ el.textContent='ERROR: '+e.message; }
  }
  document.title='DONE';
});
</script></body></html>
